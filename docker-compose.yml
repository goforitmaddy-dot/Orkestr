services:
  postgres:
    image: postgres:17
    container_name: orkestr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_project_manager
    ports:
      - '5432:5432'
    volumes:
      - orkestr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_project_manager']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  orkestr-pgdata:
    # Pin the exact volume name so it is not prefixed with the Compose
    # project name (which would orphan the existing data volume).
    name: orkestr-pgdata
